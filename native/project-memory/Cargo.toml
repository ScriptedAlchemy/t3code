[package]
name = "t3-project-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
sha2 = "0.11"
thiserror = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
